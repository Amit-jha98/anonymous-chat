services:
  - type: web
    name: ghostline-chat
    env: node
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: SOCKET_CORS_ORIGIN
        sync: false
